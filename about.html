<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About Me</title>
<style>
  html, body { margin: 0; padding: 0; }
  /* Matches the edge of the duck photo, so any strip Safari shows around its bars blends in. */
  html { background-color: #8aa2a7; }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 18px;
    color: #000;
    /* Keep the content clear of the clock, notch and home bar. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    /* Tall enough to stay behind Safari's toolbar as it grows and shrinks. */
    height: 100lvh;
    z-index: -1;
    background-image: url("duck-full.jpg");
    background-size: cover;
    background-position: 50% 50%;
    background-repeat: no-repeat;
  }
  /* Thin solid bands at the top and bottom edges. iPhone Safari copies their colors into the
     strips behind the clock and the toolbar, so those strips match the photo's edges. */
  .edge { position: fixed; left: 0; width: 100%; height: 6px; z-index: -1; }
  .edge-top { top: 0; background-color: #8aa2a7; }
  .edge-bottom { bottom: 0; background-color: #625e56; }

  a:link { color: #0000EE; }
  a:visited { color: #551A8B; }
  .page {
    max-width: 600px;
    margin: 28px auto 40px;
    box-sizing: border-box;
    width: calc(100% - 28px);
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.62);
    border: 4px ridge #999;
  }
  h1 { text-align: center; font-size: 30px; margin: 6px 0 4px; }
  .nav { text-align: center; margin: 10px 0; }
  .intro { text-align: center; margin: 28px 0; }
</style>
</head>
<body>
<div id="bg"></div>
<div class="edge edge-top"></div>
<div class="edge edge-bottom"></div>

<div class="page">
  <h1>About Me</h1>
  <hr>
  <div class="nav">
    [ <a href="index.html">Home</a> | <a href="writings.html">Writings</a> | <a href="drawings.html">Drawings</a> | <a href="photos.html">Photos</a> | <b>About Me</b> ]
  </div>
  <hr>

  <p class="intro">I&rsquo;m Nate and this is my site. Hope you enjoy!</p>

  <hr>
</div>
</body>
</html>
